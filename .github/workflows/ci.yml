name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Required by @sayan-sentinel/config's schema validation even though no
  # job here needs a real database/queue — CI only runs unit/component
  # tests, not integration tests against live Postgres/Redis.
  DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinel
  REDIS_URL: redis://localhost:6379

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
