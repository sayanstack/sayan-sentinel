# Local development stack for Sayan Sentinel.
#
# `api` and `worker` build from their Dockerfiles (apps/api/Dockerfile,
# apps/worker/Dockerfile) via Turborepo's prune pattern. NOT built/tested
# in this environment — no Docker engine is installed here (see
# docs/implementation-plan.md). `apps/web` has no Dockerfile yet.
name: sayan-sentinel

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    volumes:
      - sentinel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sentinel_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sentinel
      MINIO_ROOT_PASSWORD: sentinel-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - sentinel_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
      REDIS_URL: redis://redis:6379
    ports:
      - "4000:4000"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinel
      REDIS_URL: redis://redis:6379

  # "Sentinel Lab" — the intentionally vulnerable fixture
  # (examples/vulnerable-demo-app), included here so `api`/`worker` can
  # reach it by service name (`http://sentinel-lab:4100`) for a Full Stack
  # Scan / Target Authorization demo without any host-level setup. See
  # docs/sentinel-lab.md. Optional — omit this service (`docker compose up
  # postgres redis minio api worker`) if you don't want it running.
  sentinel-lab:
    build:
      context: examples/vulnerable-demo-app
    restart: unless-stopped
    ports:
      - "4100:4100"

volumes:
  sentinel_postgres_data:
  sentinel_redis_data:
  sentinel_minio_data:
